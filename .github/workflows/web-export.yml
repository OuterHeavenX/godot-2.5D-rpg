# Exports the Web build with Godot and publishes it to GitHub Pages.
# Pages must be set to "GitHub Actions" as its source (repo Settings > Pages).
# Runs on every push to main and on demand.
name: Web export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      # A script that fails to compile makes the web build crash at startup
      # (the engine traps with "call_indirect to a signature that does not
      # match"). Boot the game headless first and fail on any script error.
      - name: Smoke test (headless boot)
        run: |
          set -o pipefail
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --quit-after 120 2>&1 | tee smoke.log
          if grep -q "SCRIPT ERROR\|Parse Error\|Failed to instantiate an autoload" smoke.log; then
            echo "::error::Script errors during headless boot; not deploying."
            exit 1
          fi

      - name: Export
        run: tools/export_web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
